name: Deploy research dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Allowlist publish: ONLY the files listed below reach the public site.
      # Nothing else in the repository is uploaded, so a stray committed file
      # cannot leak by accident. Add a path here only after an anonymisation check,
      # and update the existence check, the copies and the generated links in the
      # same change - a rename once slipped through and the site silently stopped
      # updating for ten pushes.
      - name: Stage site (allowlist)
        run: |
          set -euo pipefail
          mkdir -p _site

          missing=0
          for f in \
            dashboard.html \
            attempts.html
          do
            if [ ! -f "$f" ]; then
              echo "::error::allowlisted file missing from the repository: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          cp dashboard.html _site/index.html
          cp dashboard.html _site/dashboard.html
          cp attempts.html _site/attempts.html

          # 公开站点只放给人看的短简报与历史目录视图。
          # 执行规则、当前总控、现役规格与文献台账不再复制到这里：它们在仓库里，
          # 简报页脚只给固定基线上的 GitHub 链接。避免同域名下再出现长文档页面。
          # results/ 下的实测记录一律不上公开站点（其中含病例时间戳等派生信息）；
          # 它们留在仓库里供导师侧 AI 读取，仓库可见性由人工确认。

          echo "--- staged files ---"
          find _site -type f | sort

          echo "--- staged files ---"
          find _site -type f | sort

      - name: Guard - fail if a blocked pattern slipped in
        run: |
          set -euo pipefail
          # 只拦真正敏感的东西：凭据、服务器绝对路径、完整患者时间戳。
          # 注意：不要拦「患者」「ocr_layout」这类正常行文/文件名——那会让正常页面部署失败。
          if grep -rIl -E 'sk-[A-Za-z0-9]{20,}|/home/[A-Za-z0-9_]+/code/[A-Za-z0-9_/]+|[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}' _site ; then
            echo "::error::blocked content pattern found in staged site"
            exit 1
          fi
          echo "guard passed"

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
